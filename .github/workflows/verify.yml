# V380 Device ID Recovery
# Pulls a V380 / V380 Pro camera Device ID out through a microSD card.
#
# Author: Vladimir Stelmak
# GitHub: https://github.com/ECD5A
#
# Module: .github/workflows/verify
# Purpose: на каждый push проверяет пакет, патч, релизный ZIP и пересборку.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payload:
    name: Payload integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check hashes, patch structure, release ZIP and rebuild
        run: python tools/check_payload.py