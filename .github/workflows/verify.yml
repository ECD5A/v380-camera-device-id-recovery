name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payload:
    name: Payload integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check hashes, patch structure and release ZIP
        run: python tools/verify_payload.py
      - name: Rebuild the package and compare it with the published ZIP
        run: python tools/test_tools.py
      - name: Ensure patch_reuse stays a 0-byte file
        run: test ! -s sdcard/patch_reuse