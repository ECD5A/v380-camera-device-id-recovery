name: Отчёт о совместимости / Compatibility report
description: Сработало ли восстановление на вашей камере. Без Device ID, IMEI и личных данных.
title: "[report] "
labels: ["compatibility-report"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт! **Не вставляйте** Device ID, содержимое QR-кода, IMEI, серийный номер, MAC, данные SIM и пароли Wi-Fi - достаточно обезличенного описания.
  - type: dropdown
    id: link
    attributes:
      label: Тип подключения
      options:
        - 4G / LTE
        - Wi-Fi
        - Ethernet
        - Неизвестно
    validations:
      required: true
  - type: input
    id: board
    attributes:
      label: Плата / модуль связи / Hwname
      description: Указывайте только реально увиденное, например на наклейке модуля. Не угадывайте.
      placeholder: "ZXInfoTek ZX800-VG / V380E6_G1 / неизвестно"
  - type: input
    id: app
    attributes:
      label: Приложение и версия
      placeholder: "V380 Pro 2.x.x, Android"
    validations:
      required: true
  - type: dropdown
    id: record
    attributes:
      label: Появился ли update_record на карте
      options:
        - Да, с last_id
        - Да, но last_id нет
        - Нет
    validations:
      required: true
  - type: dropdown
    id: accepted
    attributes:
      label: Приняло ли приложение Device ID
      options:
        - ID принят, камера подключилась и работает
        - ID принят, но камера остаётся офлайн
        - Нет
        - Не проверял
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Что происходило
      description: Сколько ждали, озвучивала ли камера обновление, что ещё лежало на карте, какой была наклейка. Само значение last_id не указывайте.
      placeholder: "Камера включилась, через ~3 минуты появился update_record..."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Подтверждение
      options:
        - label: Камера моя, и в отчёте нет Device ID, IMEI, серийных номеров, MAC и личных записей.
          required: true
